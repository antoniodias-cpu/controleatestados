<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão e Controle de Atestados</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.95);
      --field-bg: #f7f8fa;
      --field-border: #d5dce6;
      --text-dark: #1f2937;
      --text-muted: #556274;
      --btn-green: #25a841;
      --btn-green-hover: #1f9639;
      --shadow: 0 10px 28px rgba(16, 24, 40, 0.2);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-dark);
      display: grid;
      place-items: center;
      padding: 24px;
      background-image:
        linear-gradient(rgba(232, 238, 246, 0.45), rgba(232, 238, 246, 0.45)),
        url("https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1800&q=80");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(1.5px);
    }

    .title-box {
      border: 1px solid var(--field-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-weight: 700;
      margin: 0 0 14px;
      padding: 14px 16px;
      font-size: 36px;
      line-height: 1.2;
    }

    .subtitle-box,
    .year-box {
      border: 1px solid var(--field-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.7);
      text-align: center;
      font-weight: 600;
      margin: 0 0 14px;
      padding: 14px 16px;
      font-size: 21px;
      line-height: 1.2;
    }

    .year-box {
      margin-bottom: 26px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 34px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--field-border);
      border-radius: var(--radius-md);
      background: var(--field-bg);
      font-size: 33px;
      padding: 16px 18px;
      color: #3f4b5a;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #8ab4f8;
      box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2);
    }

    .actions {
      display: grid;
      gap: 16px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--btn-green);
      color: #ffffff;
      font-size: 38px;
      font-weight: 700;
      padding: 16px 20px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.12s ease;
    }

    button:hover {
      background: var(--btn-green-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 820px) {
      .card {
        width: min(640px, 100%);
        padding: 26px;
      }

      .title-box {
        font-size: clamp(22px, 5.8vw, 34px);
      }

      .subtitle-box,
      .year-box {
        font-size: clamp(18px, 4.6vw, 26px);
      }

      label {
        font-size: clamp(20px, 4.8vw, 32px);
      }

      input {
        font-size: clamp(18px, 4.6vw, 30px);
      }

      button {
        font-size: clamp(24px, 6vw, 36px);
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Acesso ao Sistema de Atestados">
    <h1 class="title-box">Gestão e Controle de Atestados</h1>
    <p class="subtitle-box">UE - CEDUP "Dario G. Salles"</p>
    <p class="year-box">2026</p>

    <form>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="admin@profe.sed.sc.gov.br" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" />
      </div>

      <div class="actions">
        <button type="submit">Entrar</button>
        <button type="button">Recuperar Senha</button>
        <button type="button">Registrar novo usuário</button>
      </div>
    </form>
  </main>
</body>
</html>
