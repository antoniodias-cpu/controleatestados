<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão e Controle de Atestados</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card" aria-label="Acesso ao Sistema de Atestados">
    <h1 class="title-box">Gestão e Controle de Atestados</h1>
    <p class="subtitle-box">UE - CEDUP "Dario G. Salles"</p>
    <p class="year-box">2026</p>

    <form id="login-form">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="admin@profe.sed.sc.gov.br" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" />
      </div>

      <div class="actions">
        <button id="btn-entrar" type="submit">Entrar</button>
        <button id="btn-recuperar" type="button">Recuperar Senha</button>
        <button id="btn-registrar" type="button" onclick="window.location.href='/novousuario.html'">Registrar novo usuário</button>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
